async function put(c, o) {
  if (!S[c]) S[c] = [];
  const idx = S[c].findIndex(x => x.id === o.id);
  if (idx >= 0) S[c][idx] = o;
  else S[c].push(o);
  saveLocalState();
  go(T);
  if (db) { try { await db.collection(c).doc(o.id).set(o); } catch (e) {} }
  return true;
}

async function rm(c, id) {
  if (S[c]) S[c] = S[c].filter(x => x.id !== id);
  saveLocalState();
  go(T);
  if (db) { try { await db.collection(c).doc(id).delete(); } catch (e) {} }
  return true;
}

const today = () => new Date().toISOString().slice(0, 10);

function calcRemainingDays(dueDateStr) {
  if (!dueDateStr) return { text: 'غير محدد', days: 0, isLate: false };
  const d1 = new Date(today());
  const d2 = new Date(dueDateStr);
  const diffTime = d2 - d1;
  const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
  if (diffDays < 0) {
    return { text: `متأخر بـ ${Math.abs(diffDays)} يوم`, days: Math.abs(diffDays), isLate: true };
  } else if (diffDays === 0) {
    return { text: 'اليوم هو آخر موعد للإرجاع', days: 0, isLate: false };
  } else {
    return { text: `متبقي ${diffDays} يوم`, days: diffDays, isLate: false };
  }
}

function renderCharts() {
  setTimeout(() => {
    const catCanvas = $('#catChart');

async function saveStudentAccount(){
  const reg = $('#login_reg').value.trim();
  const name = $('#login_name').value.trim();
  const rmNum = $('#login_rm').value.trim();
  const phone = $('#login_phone').value.trim();

  if (!reg || !name || !rmNum || !phone) {
    alert("❌ يرجى ملء جميع الحقول.");
    return;
  }

  if (!/^\d{8}$/.exec(reg)) {
    alert("❌ يجب أن يتكون رقم التسجيل الجامعي من 8 أرقام فقط.");
    return;
  }

  currentUser = { reg, name, rm: rmNum, phone };
  localStorage.setItem('mosque_student', JSON.stringify(currentUser));
  await put('students', { id: 'st_' + reg, reg, n: name, rm: rmNum, phone, date: today() });
  toast("تم إنشاء الحساب بنجاح!");
  go('st_home');
}

const VIEWS = {
  st_home: vStudentHome, st_reflection: vStudentReflection, st_exchange: vStudentExchange, st_stats: vStudentStats, st_search: vStudentSearch, st_shop: vStudentShop, st_profile: vStudentProfile, st_wish: vStudentWish, st_report: vStudentReport,

};

function renderView(t) {
  T = t;
  const tabsList = currentMode === 'student' ? STUDENT_TABS : ADMIN_TABS;
  const nv = $('#nv');
  const viewEl = $('#v');
  if (nv) nv.innerHTML = tabsList.map(x => `<button class="${x[0]===t?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');
  if (viewEl) viewEl.innerHTML = VIEWS[t] ? VIEWS[t]() : '';
}

function go(t) {
  renderView(t);
}

function init(){
  go('st_home');
  if (db) {
    ['books','shop','loans','students','reports','schedule','status','wishes','maintenance','shopOrders','exchangeBooks','bookThoughts','quizAnswers','weeklyWinner','featuredBook','weeklyReflection'].forEach(col => {
      try {
        db.collection(col).onSnapshot(snapshot => {
          let ds = snapshot.docs.map(doc => ({...doc.data(), id: doc.id}));
          if (col === 'status') { const m = ds.find(d => d.id === 'main'); if(m) S.status = m; }
          else if (col === 'schedule') { const schDoc = ds.find(d => d.id === 'weekly'); if(schDoc) S.schedule = schDoc; }
          else if (col === 'featuredBook') { const fbDoc = ds.find(d => d.id === 'current'); if(fbDoc) S.featuredBook = fbDoc; }
          else if (col === 'weeklyReflection') { const rfDoc = ds.find(d => d.id === 'current'); if(rfDoc) S.weeklyReflection = rfDoc; }
          else if (col === 'weeklyWinner') { const wDoc = ds.find(d => d.id === 'current'); if(wDoc) S.weeklyWinner = wDoc; else S.weeklyWinner = null; }
          else if (ds.length > 0) { S[col] = ds; }
          saveLocalState();
          if (!document.activeElement || !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) go(T);
        });
      } catch (e) {}
    });
  }
}

window.addEventListener('DOMContentLoaded', init);
</script>
